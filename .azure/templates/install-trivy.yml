# Plantilla de paso reutilizable: instala una versión fija de Trivy en el agente.
steps:
  - script: |
      set -euo pipefail
      curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
        | sudo tar -xz -C /usr/local/bin trivy
      trivy --version
    displayName: 'Instalar Trivy v$(TRIVY_VERSION)'
