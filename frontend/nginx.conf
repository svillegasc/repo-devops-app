# Bloque server del frontend. Escucha en 8080 (puerto sin privilegios) para que
# el contenedor pueda correr como usuario no-root. Los assets estáticos se sirven
# desde disco y cualquier petición /api/* se redirige por proxy inverso al Service del backend.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Sirve los assets pre-comprimidos producidos en la etapa de build de Docker.
    gzip_static on;

    # index.html es el punto de entrada del despliegue: siempre debe revalidarse para
    # que una nueva release se tome de inmediato (sin HTML obsoleto de la caché del navegador).
    # `no-cache` = el navegador puede cachearlo pero debe revalidar vía ETag cada
    # vez, así el contenido sin cambios devuelve un 304 barato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback estilo SPA estático a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso: el nombre DNS interno del clúster `backend` resuelve al Service
    # del backend dentro del mismo namespace. Mantener la API en el mismo origen evita
    # CORS y hace que el navegador nunca necesite saber que el backend existe.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # No filtrar la versión de Nginx en las páginas de error / headers.
    server_tokens off;
}
